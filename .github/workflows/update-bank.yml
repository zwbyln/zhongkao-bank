name: 自动更新题庄题库

# 每天从题庄采集真题 → 并进 bank/ 的分组文件 → 合并成 bank/all.json → 提交回仓库。
# 平板端在「题库 → 补题 → 网址导入」填 raw 链接，点一次即导入；
# 客户端会按内容去重，重复点同一个链接不会让题库变胖。

on:
  schedule:
    - cron: '10 21 * * *'      # UTC 21:10 = 北京 05:10
  workflow_dispatch:           # 也可以在 Actions 页手动点 Run workflow

permissions:
  contents: write              # 需要写权限才能把新题库提交回仓库

concurrency:
  group: update-bank
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 先查密钥：没有 Key 时会走匿名模式，而 GitHub 机房的出口 IP 是共享的，
      # 匿名额度常被别人用完 —— 那才是「任务显示成功、题库却一道没涨」的真正原因。
      - name: 检查密钥
        env:
          KEY: ${{ secrets.TZ_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::仓库里没有 TZ_API_KEY。到 Settings → Secrets and variables → Actions → New repository secret，名字填 TZ_API_KEY，值填题庄注册 Key。"
            exit 1
          fi
          echo "密钥已配置（${#KEY} 字符）"

      # 先用「取 1 道题」探一次额度。题庄没有独立的额度查询接口，
      # 剩余额度只在取题响应的 quota_remaining_today 里出现（采集脚本会打印它）。
      # 这一步花 1 道题的额度，换来的信息是：今天到底还能不能采、还剩多少。
      - name: 试探今日额度
        # 这一步只想知道「今天还剩多少额度」。额度用尽属于正常收工，不是故障。
        id: quota
        env:
          QUESTION_SERVICE_LICENSE: ${{ secrets.TZ_API_KEY }}
        run: |
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          ENVF="${GITHUB_ENV:-/dev/null}"
          set +e
          OUT=$(python3 tizhuang_fetch.py --subject 语文 --grade 七年级 --limit 1 \
                  --out /tmp/probe.json 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tail -8
          rm -f /tmp/probe.json /tmp/probe_复核.json
          # 注意 set -e 下 grep 找不到会返回 1，整段脚本会静默退出，必须 || true 兜住。
          LEFT=$(echo "$OUT" | grep -o '剩余额度 [0-9]*' | head -1 | grep -o '[0-9]*' || true)

          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -q '429\|额度'; then
              # 正常收工：今天的额度用完了。标成 notice（蓝点），不标红叉。
              echo "::notice::今日额度已用尽——这不是故障。题库保持不变，北京时间 0 点额度重置后自动继续。"
              echo "### ⏸ 今日额度已用尽，本轮跳过" >> "$SUM"
              echo "" >> "$SUM"
              echo "**这不是故障。** 题库保持不变，北京时间 0 点额度重置后自动继续。" >> "$SUM"
              echo "SKIP_FETCH=1" >> "$ENVF"
              exit 0
            fi
            if echo "$OUT" | grep -q '401\|403\|认证失败'; then
              echo "::error::Key 无效或已停用。到 Settings → Secrets 重新填 TZ_API_KEY。"
              echo "### ⛔ Key 无效" >> "$SUM"
              echo "" >> "$SUM"
              echo "本轮未采集。请更新仓库 Secret \`TZ_API_KEY\`。" >> "$SUM"
              exit 1
            fi
            # 其它原因（网络抖动等）不阻塞采集，让九组自己试
            echo "::warning::试探没成功，仍继续跑九组（原因见上）"
            exit 0
          fi

          if [ -z "$LEFT" ]; then
            echo "::notice::试探成功但没解析出剩余额度，继续跑九组"
            exit 0
          fi

          echo "今日剩余额度约 ${LEFT} 题（维护日最多需 144 题）"
          echo "- 试探后剩余额度：**${LEFT}** 题（维护日最多需 144）" >> "$SUM"
          if [ "$LEFT" -lt 10 ]; then
            # 一组最少 10 题，不够就整轮不做
            echo "::notice::今日额度只剩 ${LEFT} 题，不足一组（最少 10 题），本轮跳过采集。这不是故障。"
            echo "### ⏸ 额度不足，本轮跳过" >> "$SUM"
            echo "" >> "$SUM"
            echo "只剩 **${LEFT}** 题，不够任何一组。**这不是故障**，题库保持不变，0 点重置后自动补。" >> "$SUM"
            echo "SKIP_FETCH=1" >> "$ENVF"
          elif [ "$LEFT" -lt 144 ]; then
            echo "::warning::剩余 ${LEFT} 题，不够维护日全部组用（最多 144），靠后的组会被 429 挡回。"
          fi

      - name: 采集真题
        if: env.SKIP_FETCH != '1'
        env:
          QUESTION_SERVICE_LICENSE: ${{ secrets.TZ_API_KEY }}
        run: |
          # 本地试跑时没有这个变量，给个兜底，免得 >> "" 报 No such file
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "${SKIP_FETCH:-0}" = "1" ]; then
            echo "额度不足，跳过采集（见上一步）"
            exit 0
          fi
          # 文件没传对时，「每组都失败」的报错会指向 Key 和额度，误导排查方向。
          for f in tizhuang_fetch.py bank_delta.py merge_bank.py; do
            if [ ! -f "$f" ]; then
              echo "::error::仓库里找不到 $f。请把它放到仓库根目录（与 .github 文件夹同级）。"
              exit 1
            fi
          done
          mkdir -p bank
          OK=0; BAD=0
          pick() {
            echo "──────────────────────────────"
            if python3 tizhuang_fetch.py "$@" --append; then
              OK=$((OK+1))
            else
              BAD=$((BAD+1))
              echo "::warning::这组没取到题：$*"
            fi
          }
          # --append：新题并进旧文件，题庄是 random_order 取题，累加才叫「攒题库」
          # 额度分配（2026-11 调整）：注册 Key 每天 150 题，最重的维护日合计 144 道，留 6 道余量。
          # 语文 189 / 历史 209 道已经够用，英语只有 83 道且是唯一薄弱项，
          # 所以把额度大头让给英语。语文/历史改为隔天低量维护，不再每天吃满额度。
          DAY=$(date -u +%u)   # 1=周一 … 7=周日
          if [ "$((DAY % 2))" -eq 0 ]; then
            # 偶数日：语文历史维护（各 6 道，保持题库不缩水）
            pick --subject 语文 --grade 八年级 --limit 6 --out bank/zk-yuwen-8.json
            pick --subject 语文 --grade 九年级 --limit 6 --out bank/zk-yuwen-9.json
            pick --subject 历史 --grade 八年级 --limit 6 --keep-out-of-scope --out bank/zk-lishi-8.json
            pick --subject 历史 --grade 九年级 --limit 6 --keep-out-of-scope --out bank/zk-lishi-9.json
            pick --subject 语文 --grade 七年级 --limit 5 --out bank/tb-yuwen-7.json
            pick --subject 历史 --grade 七年级 --limit 5 --out bank/tb-lishi-7.json
          fi
          # 英语：只取「选择题」（唯一能自动批改的四选一），按语法点入库。
          # 每天四组打满 110 道；题庄 random_order 会抽到重复题，靠 --append 去重后
          # 净增才是真入库量。七年级同步 + 八九年级中考 + 中考阶段，覆盖全学段。
          pick --subject 英语 --grade 七年级 --limit 25 --out bank/tb-yingyu-7.json
          pick --subject 英语 --grade 八年级 --limit 35 --out bank/zk-yingyu-8.json
          pick --subject 英语 --grade 九年级 --limit 35 --out bank/zk-yingyu-9.json
          # 中考阶段：全学段英语综合选择题，扩大来源池（七年级 id 段之外的老题）
          # grade 必须是元数据里的准确名称「中考阶段」
          pick --subject 英语 --grade 中考阶段 --limit 15 --out bank/zk-yingyu-zk.json || true

          find bank -name '*.json' -size 0 -delete
          ls -l bank

          # 「本轮新增」按各组 items 的实际增长算，不读 stats.added。
          # stats.added 是「那次写入当次新增几道」，--append 之后文件里留下的仍是旧值，
          # 拿它当本轮结果会把「一组都没采到」误判成「新增 110 道」，任务照样打绿勾。
          NEW=$(python3 bank_delta.py 2>/dev/null || echo 0)
          # 脚本万一出错，别让 NEW 变成空字符串（[ "" -eq 0 ] 会直接报错退出）
          case "$NEW" in ''|*[!0-9]*) NEW=0 ;; esac
          echo "本轮新增 $NEW 道 · 成功 $OK 组 / 失败 $BAD 组"
          {
            echo "### 本轮采集结果"
            echo ""
            echo "| 项目 | 数值 |"
            echo "|---|---|"
            echo "| 成功分组 | $OK |"
            echo "| 失败分组 | $BAD |"
            echo "| 本轮新增题目 | $NEW 道 |"
          } >> "$SUM"

          if [ "$NEW" -eq 0 ]; then
            echo "::error::本轮一道题也没采到。依次排查：①TZ_API_KEY 是否填对（Key 过期需重新注册）；②题庄今日额度是否用完；③上面每组的具体报错。"
            exit 1
          fi

          # 英语是新增科目，单独报一下，免得「题库涨了但英语是 0」被平均数盖住
          EN=$(python3 -c "import json,glob; print(sum(len(json.load(open(f,encoding='utf-8')).get('items') or []) for f in glob.glob('bank/*yingyu*.json')))" 2>/dev/null || echo 0)
          echo "- 英语题库现有 **$EN** 道" >> "$SUM"

      - name: 追加进 all.json
        # 跳过采集的那轮没有新题，合并跑一遍也是原地不动，直接免掉
        #
        # 为什么不再走全量合并（merge_bank 的那条命令）：
        # all.json 是「已经过质检」的产物，bank/ 下还躺着几份更早的原始分组文件。
        # 全量重合并等于让所有题再被质检一次，质检规则哪怕微调过一点，也会把上次
        # 保留的题重新判掉——题库数量莫名变少，排查时完全看不出是哪一步吃掉的。
        # 2026-11-25 就踩过一次：本地手工追加到 713 道，CI 全量重合并直接覆盖成 783 道
        # （既有重新判进来的旧题，也有重新判出去的），两边的数字哪个才对都说不清。
        # 现在只对新题把关，老题一个字节都不动。
        if: env.SKIP_FETCH != '1'
        run: |
          set -o pipefail
          # 本轮新抓的分组文件（--append 写的是「题庄_学科_年级_题库.json」）
          NEW=$(ls -1 bank/题庄_*_题库.json 2>/dev/null || true)
          if [ -z "$NEW" ]; then
            echo "- 本轮没抓到新题，题库保持原样" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          # 退出码 2 = 全是重复题，append_bank 会主动不写文件（见其文件头）
          if python3 append_bank.py --bank bank $NEW; then
            echo "追加完成"
          else
            RC=$?
            if [ "$RC" = "2" ]; then
              echo "- 本轮抓到的都是已有题，题库保持原样" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "SKIP_COMMIT=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::append_bank.py 失败（退出码 $RC）"
            exit "$RC"
          fi

      - name: 提交回仓库
        if: env.SKIP_FETCH != '1'
        run: |
          # 跳过采集的那轮，没有任何新题，不必提交，也别报错
          if [ "${SKIP_FETCH:-0}" = "1" ]; then
            echo "本轮跳过采集，没有需要提交的内容"
            echo "- 本轮跳过：额度不足，题库保持原样" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          # append_bank 判定「全是重复题、文件没动」时写下来的标记
          if [ "${SKIP_COMMIT:-0}" = "1" ]; then
            echo "本轮没有新题，跳过提交"
            exit 0
          fi
          git config user.name  "bank-bot"
          git config user.email "bank-bot@users.noreply.github.com"
          # 先把本轮的产物存到仓库外面，等下每轮重试都要用到
          # 把 all.json.gz 和 meta.json 一起存出来：这两个是 merge 步骤生成的，
          # reset --hard 之后虽然未跟踪文件通常还在，但别赌这个行为——
          # 少一个 meta.json，手机端就退化成每次重下 1.38 MB，正好是这轮要解决的问题。
          mkdir -p /tmp/bank-out
          cp -f bank/*.json /tmp/bank-out/
          # 分开写：zsh 下 *.gz 没匹配到会把字面量传进去，一个失败连累前半句
          cp -f bank/all.json.gz bank/meta.json /tmp/bank-out/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            # 对齐远端最新。采集那两三分钟里若有别人也提交（手动改文件、另一个 run），
            # 直接 push 会被「fetch first」拒掉；题库是生成物，冲突时以本轮结果为准。
            git reset -q --hard origin/main
            cp -f /tmp/bank-out/* bank/ 2>/dev/null || true
            git add bank
            if git diff --staged --quiet; then
              echo "题库没有变化，跳过提交"
              echo "- 本轮题库无变化（取到的都是已有题）" >> "$SUM"
              exit 0
            fi
            git commit -q -m "自动更新题库 $(date +%F)"
            if git push -q origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              TOTAL=$(python3 -c "import json;print(json.load(open('bank/all.json',encoding='utf-8'))['stats']['usable'])")
              echo "- 合并后题库共 **$TOTAL** 道" >> "$SUM"
              exit 0
            fi
            # 退避是必须的：失败后立刻重试，往往撞在同一秒的另一个提交上
            WAIT=$((i * 8))
            echo "::warning::第 $i 次推送被拒，${WAIT}s 后与远端重新对齐再试"
            sleep $WAIT
          done
          echo "::error::五次推送都被拒绝，请检查分支保护规则"
          exit 1
