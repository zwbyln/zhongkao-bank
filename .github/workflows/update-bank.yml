name: 自动更新题庄题库

# 每天从题庄采集真题 → 并进 bank/ 的分组文件 → 合并成 bank/all.json → 提交回仓库。
# 平板端在「题库 → 补题 → 网址导入」填 raw 链接，点一次即导入；
# 客户端会按内容去重，重复点同一个链接不会让题库变胖。

on:
  schedule:
    - cron: '10 21 * * *'      # UTC 21:10 = 北京 05:10
  workflow_dispatch:           # 也可以在 Actions 页手动点 Run workflow

permissions:
  contents: write              # 需要写权限才能把新题库提交回仓库

concurrency:
  group: update-bank
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 先查密钥：没有 Key 时会走匿名模式，而 GitHub 机房的出口 IP 是共享的，
      # 匿名额度常被别人用完 —— 那才是「任务显示成功、题库却一道没涨」的真正原因。
      - name: 检查密钥
        env:
          KEY: ${{ secrets.TZ_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::仓库里没有 TZ_API_KEY。到 Settings → Secrets and variables → Actions → New repository secret，名字填 TZ_API_KEY，值填题庄注册 Key。"
            exit 1
          fi
          echo "密钥已配置（${#KEY} 字符）"

      # 先用「取 1 道题」探一次额度。题庄没有独立的额度查询接口，
      # 剩余额度只在取题响应的 quota_remaining_today 里出现（采集脚本会打印它）。
      # 这一步花 1 道题的额度，换来的信息是：今天到底还能不能采、还剩多少。
      - name: 试探今日额度
        env:
          QUESTION_SERVICE_LICENSE: ${{ secrets.TZ_API_KEY }}
        run: |
          # GITHUB_STEP_SUMMARY 只有 Actions 里才有，本地试跑时给个兜底，别报 No such file。
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          set +e
          OUT=$(python3 tizhuang_fetch.py --subject 语文 --grade 七年级 --limit 1 \
                  --out /tmp/probe.json 2>&1)
          RC=$?
          set -e
          echo "$OUT" | tail -8
          LEFT=$(echo "$OUT" | grep -o '剩余额度 [0-9]*' | head -1 | grep -o '[0-9]*')
          if [ $RC -ne 0 ]; then
            # 额度用尽 / Key 失效，继续跑九组也只是把同样的错误重复九遍，直接停。
            if echo "$OUT" | grep -q '429\|额度'; then
              echo "::error::今日额度已用尽，本轮不用跑了。等北京时间 0 点重置，或换一个 Key。"
              echo "### ⛔ 今日额度已用尽" >> "$SUM"
              echo "" >> "$SUM"
              echo "本轮未采集，题库保持不变。九组共需 130 题。" >> "$SUM"
              exit 1
            fi
            if echo "$OUT" | grep -q '401\|403\|认证失败'; then
              echo "::error::Key 无效或已停用。到 Settings → Secrets 重新填 TZ_API_KEY。"
              echo "### ⛔ Key 无效" >> "$SUM"
              echo "" >> "$SUM"
              echo "本轮未采集。请更新仓库 Secret \`TZ_API_KEY\`。" >> "$SUM"
              exit 1
            fi
            echo "::warning::试探那一下没成功，但仍继续跑（原因见上）"
          elif [ -n "$LEFT" ]; then
            echo "今日剩余额度约 ${LEFT} 题（九组共需 130 题）"
            echo "- 试探后剩余额度：**${LEFT}** 题（九组共需 130）" >> "$SUM"
            # 剩这么点，连一组 15 道都凑不齐，九组只会连着 429。
            # 直接跳过采集，让任务以「额度不足」结束——比报一串 429 清楚。
            if [ "$LEFT" -lt 10 ]; then
              echo "::warning::今日额度只剩 ${LEFT} 题，不足一组（最少 10 题），本轮跳过采集。"
              echo "### ⏸ 额度不足，本轮跳过" >> "$SUM"
              echo "" >> "$SUM"
              echo "只剩 **${LEFT}** 题，不够任何一组采集。题库保持不变，明天 0 点额度重置后自动补。" >> "$SUM"
              echo "SKIP_FETCH=1" >> "$GITHUB_ENV"
            elif [ "$LEFT" -lt 130 ]; then
              echo "::warning::剩余 ${LEFT} 题，不够九组用，靠后的组会被 429 挡回。想省额度就把用不上的组删掉。"
            fi
          fi
          rm -f /tmp/probe.json /tmp/probe_复核.json

      - name: 采集真题
        env:
          QUESTION_SERVICE_LICENSE: ${{ secrets.TZ_API_KEY }}
        run: |
          # 本地试跑时没有这个变量，给个兜底，免得 >> "" 报 No such file
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "${SKIP_FETCH:-0}" = "1" ]; then
            echo "额度不足，跳过采集（见上一步）"
            exit 0
          fi
          # 文件没传对时，「每组都失败」的报错会指向 Key 和额度，误导排查方向。
          for f in tizhuang_fetch.py bank_delta.py merge_bank.py; do
            if [ ! -f "$f" ]; then
              echo "::error::仓库里找不到 $f。请把它放到仓库根目录（与 .github 文件夹同级）。"
              exit 1
            fi
          done
          mkdir -p bank
          OK=0; BAD=0
          pick() {
            echo "──────────────────────────────"
            if python3 tizhuang_fetch.py "$@" --append; then
              OK=$((OK+1))
            else
              BAD=$((BAD+1))
              echo "::warning::这组没取到题：$*"
            fi
          }
          # --append：新题并进旧文件，题庄是 random_order 取题，累加才叫「攒题库」
          # 额度分配：注册 Key 每天 150 题，九组加起来要压在 130 以内，留出重试余量。
          pick --subject 语文 --grade 八年级 --limit 15 --out bank/zk-yuwen-8.json
          pick --subject 语文 --grade 九年级 --limit 15 --out bank/zk-yuwen-9.json
          # 历史中考是全学段综合考查，放开内容范围
          pick --subject 历史 --grade 八年级 --limit 15 --keep-out-of-scope --out bank/zk-lishi-8.json
          pick --subject 历史 --grade 九年级 --limit 15 --keep-out-of-scope --out bank/zk-lishi-9.json
          # 七年级同步练习：严格按年级内容范围过滤
          pick --subject 语文 --grade 七年级 --limit 10 --out bank/tb-yuwen-7.json
          pick --subject 历史 --grade 七年级 --limit 10 --out bank/tb-lishi-7.json
          # 英语：只取「选择题」（唯一能自动批改的四选一），按语法点入库。
          # 新科目题量还薄，所以八/九年级多给一点。
          pick --subject 英语 --grade 八年级 --limit 20 --out bank/zk-yingyu-8.json
          pick --subject 英语 --grade 九年级 --limit 20 --out bank/zk-yingyu-9.json
          pick --subject 英语 --grade 七年级 --limit 10 --out bank/tb-yingyu-7.json

          find bank -name '*.json' -size 0 -delete
          ls -l bank

          # 「本轮新增」按各组 items 的实际增长算，不读 stats.added。
          # stats.added 是「那次写入当次新增几道」，--append 之后文件里留下的仍是旧值，
          # 拿它当本轮结果会把「一组都没采到」误判成「新增 110 道」，任务照样打绿勾。
          NEW=$(python3 bank_delta.py 2>/dev/null || echo 0)
          # 脚本万一出错，别让 NEW 变成空字符串（[ "" -eq 0 ] 会直接报错退出）
          case "$NEW" in ''|*[!0-9]*) NEW=0 ;; esac
          echo "本轮新增 $NEW 道 · 成功 $OK 组 / 失败 $BAD 组"
          {
            echo "### 本轮采集结果"
            echo ""
            echo "| 项目 | 数值 |"
            echo "|---|---|"
            echo "| 成功分组 | $OK |"
            echo "| 失败分组 | $BAD |"
            echo "| 本轮新增题目 | $NEW 道 |"
          } >> "$SUM"

          if [ "$NEW" -eq 0 ]; then
            echo "::error::本轮一道题也没采到。依次排查：①TZ_API_KEY 是否填对（Key 过期需重新注册）；②题庄今日额度是否用完；③上面每组的具体报错。"
            exit 1
          fi

          # 英语是新增科目，单独报一下，免得「题库涨了但英语是 0」被平均数盖住
          EN=$(python3 -c "import json,glob; print(sum(len(json.load(open(f,encoding='utf-8')).get('items') or []) for f in glob.glob('bank/*yingyu*.json')))" 2>/dev/null || echo 0)
          echo "- 英语题库现有 **$EN** 道" >> "$SUM"

      - name: 合并成一个文件
        run: python3 merge_bank.py --dir bank

      - name: 提交回仓库
        run: |
          # 跳过采集的那轮，没有任何新题，不必提交，也别报错
          if [ "${SKIP_FETCH:-0}" = "1" ]; then
            echo "本轮跳过采集，没有需要提交的内容"
            exit 0
          fi
          git config user.name  "bank-bot"
          git config user.email "bank-bot@users.noreply.github.com"
          # 先把本轮的产物存到仓库外面，等下每轮重试都要用到
          mkdir -p /tmp/bank-out && cp -f bank/*.json /tmp/bank-out/
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            # 对齐远端最新。采集那两三分钟里若有别人也提交（手动改文件、另一个 run），
            # 直接 push 会被「fetch first」拒掉；题库是生成物，冲突时以本轮结果为准。
            git reset -q --hard origin/main
            cp -f /tmp/bank-out/*.json bank/
            git add bank
            if git diff --staged --quiet; then
              echo "题库没有变化，跳过提交"
              echo "- 本轮题库无变化（取到的都是已有题）" >> "$SUM"
              exit 0
            fi
            git commit -q -m "自动更新题库 $(date +%F)"
            if git push -q origin HEAD:main; then
              echo "推送成功（第 $i 次尝试）"
              TOTAL=$(python3 -c "import json;print(json.load(open('bank/all.json',encoding='utf-8'))['stats']['usable'])")
              echo "- 合并后题库共 **$TOTAL** 道" >> "$SUM"
              exit 0
            fi
            # 退避是必须的：失败后立刻重试，往往撞在同一秒的另一个提交上
            WAIT=$((i * 8))
            echo "::warning::第 $i 次推送被拒，${WAIT}s 后与远端重新对齐再试"
            sleep $WAIT
          done
          echo "::error::五次推送都被拒绝，请检查分支保护规则"
          exit 1
